version: "3.9"

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: novel-forge-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: novelforge
      POSTGRES_PASSWORD: novelforge123
      POSTGRES_DB: novelforge
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U novelforge"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
