name: CI

# 标签（snap/* 快照锚点、backup/* 备份锚点、v* 发版标签）都不跑 CI，
# 省得打标签/发版时白烧 4 分钟；CI 只在 push 到 main/master 分支时跑
on:
  push:
    branches: [main, master]
    tags-ignore:
      - '*'
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - name: Install
        run: npm ci || npm install
      # Prisma Client 生成必须有 DATABASE_URL，否则会「静默成功但什么都不生成」：
      # postinstall 里的 `prisma generate` 在 install 阶段拿不到 DATABASE_URL，
      # 退出码仍是 0，却不会产出 src/generated/prisma —— 紧接着的 tsc 就会因为
      # `Cannot find module '@/generated/prisma/client'` 报 200+ 个错，CI 直接变红。
      # 所以这里在 install 之后、tsc 之前，显式带 DATABASE_URL 再生成一次。
      - name: Generate Prisma Client
        run: |
          npx prisma generate
          # 静默失败兜底：上面那条命令在缺 DATABASE_URL 时会 exit 0 但不产出文件，
          # 这里显式检查产物，把「200+ 个莫名其妙的 tsc 报错」收敛成一句人话。
          if [ ! -f src/generated/prisma/client.ts ]; then
            echo "::error::Prisma Client 未生成（src/generated/prisma/client.ts 不存在）——检查 DATABASE_URL 与 prisma.config.ts"
            exit 1
          fi
          echo "Prisma Client 已生成：src/generated/prisma/client.ts"
        env:
          DATABASE_URL: "file:./data/novelforge.db"
      # 直连 SQLite 的集成测试（chat-sessions / babylore 自检等）需要真实的表结构。
      # 项目卖点是「clone 后零安装即用本地 SQLite」，CI 里跑一次 db push 正好验证这条路径。
      # 缺这一步时这些套件会以 PrismaClientKnownRequestError 整组失败（表不存在）。
      - name: Setup database
        run: npx prisma db push
        env:
          DATABASE_URL: "file:./data/novelforge.db"
      - name: Type check
        run: npx tsc --noEmit
      - name: Test
        run: npm test
        env:
          DATABASE_URL: "file:./data/novelforge.db"
      - name: Color guard (ARCH-7)
        run: npm run lint:colors
      - name: Build
        run: npm run build
      # lint 存量 2542 问题（1134 errors，多为历史 no-explicit-any）为技术债，暂不硬门禁；
      # 待专项清理后移除豁免。tsc/vitest/build 已是硬门禁，任一失败即红。
      - name: Lint (legacy debt, non-blocking)
        run: npm run lint || echo "::warning::lint 存量 1134 errors 待专项清理"
